PLG_SYSTEM_TAGROUTING_HELP_TITLE="How SmartTag Routing works"

PLG_SYSTEM_TAGROUTING_HELP_OVERVIEW="<h3>Start with your tags</h3><p>Organise your Joomla tags into useful branches, such as Colour with Blue and Red beneath it, or Topics with Travel beneath it. Examples below use imaginary aliases: replace them with your own.</p><h3>Choose the features you need</h3><ul><li><strong>Canonical cleanup:</strong> keeps links tidy when a menu item already represents the same selection. It does not change your content.</li><li><strong>Standalone tag pages:</strong> let visitors explore content by tag, across categories. For example, <code>/tags/colour/blue</code> opens the Blue tag page.</li><li><strong>Category filters:</strong> narrow the articles within an existing category. For example, <code>/articles/!/blue</code> keeps the Articles category and filters it by Blue. Its category breadcrumb stays the same.</li></ul><h3>Create a tag browsing area</h3><p>Create a <strong>SmartTag Pages</strong> menu item. An alias such as <code>tags</code> gives your tag pages a base like <code>/tags/</code>; menu items nested under other menus include that full path. Choose the page shown when no tag is selected, the content types to include and the results per page. A blank content-type selection allows all types. A blank page-size value uses the Joomla list limit.</p><p>The virtual tag root uses the normal tag-page layout without content results; a compatible template can show the tag hierarchy there. Top-level tags lists only root tags, All tags shows the full list, and Empty leaves the landing page content to your template and modules. Visiting a tag beneath the menu opens its tag page.</p><h3>Read a filter URL</h3><ul><li><code>/</code> follows a hierarchy: <code>colour/blue</code> means Blue beneath Colour.</li><li><code>,</code> means OR: <code>blue,red</code> matches either colour.</li><li><code>+</code> means AND: <code>blue+travel</code> requires both tags.</li></ul><p>Combined example: <code>/articles/!/blue,red+travel</code> means articles tagged Blue OR Red, and also Travel. The marker separates the page from its filters; <code>!</code>, <code>!tag</code> and <code>!filter</code> are alternative spellings, not different filtering modes.</p><h3>Choose which filters are available</h3><p>By default, assign a parent tag such as Colour to the category where you want its filters. Blue and Red beneath it then become permitted choices. Inherited mode also uses the roots assigned to parent categories; inherited roots cannot be hidden in a child. All available tags removes this assignment restriction. Your template decides which controls visitors actually see.</p><h3>Understand descendants</h3><p>With descendant matching off, selecting Colour matches items tagged Colour itself. With it on, items tagged only Blue or Red also match. Selecting a parent and a child does not automatically deselect either control. A SmartTag Pages menu item can use the global default or override it with Yes or No for its additional filters. Joomla Tags Include Children still separately controls the base tag page.</p><h3>Add filters to a tag page</h3><p>Enable additional tag filters in the SmartTag Pages menu item and select their permitted roots, or explicitly allow all available tags. An empty roots selection allows none. The menu must have a route and use that route as its canonical URL. Example: <code>/tags/topics/travel/!/blue</code> keeps the Travel tag page and narrows its results by Blue. Clear the extra filters to return to Travel. Extra filters are not supported on root-marker standalone URLs.</p><h3>Markers and breadcrumbs</h3><p>Accepted markers controls which separators your site understands. The canonical marker chooses the separator used in generated links. To use a custom value such as <code>!browse</code>, enable Custom and enter it. Turning the switch off retains its text. On standalone tag pages you can show a breadcrumb marker such as # or remove that marker while keeping the tag hierarchy.</p><p>Root-marker binding decides whether a URL such as <code>/!/colour/blue</code> opens a standalone tag page using the menu context. Leave it independent when your underlying page needs that marker for its own filtering; standalone links then use the explicit menu route.</p><h3>Results and appearance</h3><p>Page size applies across the selected content types, with one shared pagination. Optional article-category grouping puts articles under their own categories and omits separate category results. A group may continue on the next page. Your template must support the group display and any visible filter controls; enabling routing alone does not add buttons or change the page design.</p><p>Access, publication and language rules still apply. Limits constrain the size of filter expressions: in <code>blue,red+travel</code> there are two AND groups and three choices in total. Keep the defaults unless you need larger combinations. Use <strong>Inline Help</strong> beside the settings for individual explanations.</p>"

PLG_SYSTEM_TAGROUTING_HELP_TAB="How to use"
PLG_SYSTEM_TAGROUTING_HELP_SUMMARY="SmartTag provides readable tag pages and tag filters within categories. Choose the features below; your template controls their appearance. Enable Inline Help for individual settings, or <a href='%s'>read How to use</a> for setup guidance and examples."
