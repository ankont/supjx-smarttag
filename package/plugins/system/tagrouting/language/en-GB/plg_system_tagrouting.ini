PLG_SYSTEM_TAGROUTING="SuperSoftJx - SmartTag Routing"
PLG_SYSTEM_TAGROUTING_XML_DESCRIPTION="Provides modular canonical cleanup, standalone hierarchical Joomla tag pages, faceted content-category routes, menu context, and taxonomy breadcrumbs."
PLG_SYSTEM_TAGROUTING_FIELD_CLEANUP_LABEL="Canonical cleanup"
PLG_SYSTEM_TAGROUTING_FIELD_CLEANUP_DESC="Uses matching Joomla menu items to remove redundant tag, type, and language filter parameters from generated URLs."
PLG_SYSTEM_TAGROUTING_FIELD_HIERARCHICAL_LABEL="Hierarchical standalone tag URLs"
PLG_SYSTEM_TAGROUTING_FIELD_HIERARCHICAL_DESC="Enables standalone com_tags pages below a SupJx SmartTag Pages menu route or a routing marker."
PLG_SYSTEM_TAGROUTING_FIELD_FACETED_LABEL="Faceted category filters"
PLG_SYSTEM_TAGROUTING_FIELD_FACETED_DESC="Enables explicit marker-based tag-filter expressions below Joomla content-category routes."
PLG_SYSTEM_TAGROUTING_FIELD_ACCEPTED_MARKERS_LABEL="Accepted routing markers"
PLG_SYSTEM_TAGROUTING_FIELD_ACCEPTED_MARKERS_DESC="Select all marker segments accepted for standalone and faceted input routes."
PLG_SYSTEM_TAGROUTING_FIELD_ENABLE_CUSTOM_MARKER_LABEL="Enable custom marker"
PLG_SYSTEM_TAGROUTING_FIELD_ENABLE_CUSTOM_MARKER_DESC="Accept one additional custom marker segment."
PLG_SYSTEM_TAGROUTING_FIELD_CUSTOM_MARKER_LABEL="Custom marker"
PLG_SYSTEM_TAGROUTING_FIELD_CUSTOM_MARKER_DESC="One URL segment beginning with ! and containing only lowercase letters, digits, or hyphens; for example !facet."
PLG_SYSTEM_TAGROUTING_FIELD_CANONICAL_MARKER_LABEL="Canonical routing marker"
PLG_SYSTEM_TAGROUTING_FIELD_CANONICAL_MARKER_DESC="Marker emitted by generated URLs. It must also be enabled; invalid combinations safely fall back to an enabled marker."
PLG_SYSTEM_TAGROUTING_FIELD_BREADCRUMB_MARKER_LABEL="Breadcrumb tag marker"
PLG_SYSTEM_TAGROUTING_FIELD_BREADCRUMB_MARKER_DESC="Separate breadcrumb item between Joomla/menu navigation and the standalone tag hierarchy, for both marker-based and menu-based tag pages. Default: #."
PLG_SYSTEM_TAGROUTING_FIELD_SHOW_BREADCRUMB_MARKER_LABEL="Show breadcrumb tag marker"
PLG_SYSTEM_TAGROUTING_FIELD_SHOW_BREADCRUMB_MARKER_DESC="When disabled, no separator item is inserted before the standalone tag hierarchy."
PLG_SYSTEM_TAGROUTING_MARKER_SHORT="!"
PLG_SYSTEM_TAGROUTING_MARKER_TAG="!tag"
PLG_SYSTEM_TAGROUTING_MARKER_FILTER="!filter"
PLG_SYSTEM_TAGROUTING_MARKER_CUSTOM="Custom marker"
PLG_SYSTEM_TAGROUTING_MAX_GROUPS_LABEL="Maximum AND groups"
PLG_SYSTEM_TAGROUTING_MAX_GROUPS_DESC="Maximum groups separated by + in a category-filter expression. Default 10; hard maximum 16. Over-limit requests return 404."
PLG_SYSTEM_TAGROUTING_MAX_OR_LABEL="Maximum OR options per group"
PLG_SYSTEM_TAGROUTING_MAX_OR_DESC="Maximum comma-separated tag paths per group. Default 10; hard maximum 32. A hierarchical path counts as one option."
PLG_SYSTEM_TAGROUTING_MAX_OPTIONS_LABEL="Maximum options in total"
PLG_SYSTEM_TAGROUTING_MAX_OPTIONS_DESC="Maximum tag paths across all groups, counting repetitions. Default 15; hard maximum 512."
PLG_SYSTEM_TAGROUTING_MAX_BYTES_LABEL="Maximum filter-expression bytes"
PLG_SYSTEM_TAGROUTING_MAX_BYTES_DESC="Maximum decoded expression length in UTF-8 bytes, excluding the category route and marker. Default 1024; hard maximum 2048."
