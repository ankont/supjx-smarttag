PLG_SYSTEM_TAGROUTING="SuperSoftJx - SmartTag Routing"
PLG_SYSTEM_TAGROUTING_XML_DESCRIPTION="Provides modular canonical cleanup, standalone hierarchical Joomla tag pages, faceted content-category routes, menu context, and taxonomy breadcrumbs."
PLG_SYSTEM_TAGROUTING_FIELD_CLEANUP_LABEL="Canonical cleanup"
PLG_SYSTEM_TAGROUTING_FIELD_CLEANUP_DESC="Uses a matching menu item to produce a cleaner URL when that menu already represents the same tag/filter selection. It does not change which results are displayed."
PLG_SYSTEM_TAGROUTING_FIELD_HIERARCHICAL_LABEL="Hierarchical standalone tag URLs"
PLG_SYSTEM_TAGROUTING_FIELD_HIERARCHICAL_DESC="Opens individual tag pages using their hierarchy. Example: /tags/colour/blue. Create a SmartTag Pages menu item with alias tags to define that base route; /!/colour/blue is the marker-based alternative when configured."
PLG_SYSTEM_TAGROUTING_FIELD_FACETED_LABEL="Faceted category filters"
PLG_SYSTEM_TAGROUTING_FIELD_FACETED_DESC="Filters articles within their existing category page. Example: /articles/!/blue,red+travel means Blue OR Red, AND Travel. A slash follows tag hierarchy, a comma means OR, and + means AND. The category breadcrumb stays unchanged."
PLG_SYSTEM_TAGROUTING_FIELD_ACCEPTED_MARKERS_LABEL="Accepted routing markers"
PLG_SYSTEM_TAGROUTING_FIELD_ACCEPTED_MARKERS_DESC="Choose which markers incoming URLs may use: !, !tag and !filter are alternative separators, not different filter modes. To accept !facet, enable Custom and enter !facet. Switching Custom off retains its text. The canonical setting below chooses which enabled marker generated links use."
PLG_SYSTEM_TAGROUTING_FIELD_ENABLE_CUSTOM_MARKER_LABEL="Enable custom marker"
PLG_SYSTEM_TAGROUTING_FIELD_ENABLE_CUSTOM_MARKER_DESC="Accept one additional custom marker segment."
PLG_SYSTEM_TAGROUTING_FIELD_CUSTOM_MARKER_LABEL="Custom marker"
PLG_SYSTEM_TAGROUTING_FIELD_CUSTOM_MARKER_DESC="One URL segment beginning with ! and containing only lowercase letters, digits, or hyphens; for example !facet."
PLG_SYSTEM_TAGROUTING_FIELD_CANONICAL_MARKER_LABEL="Canonical routing marker"
PLG_SYSTEM_TAGROUTING_FIELD_CANONICAL_MARKER_DESC="The marker used in generated links. For example, choosing !filter produces /articles/!filter/blue. Other enabled markers remain accepted; Joomla SEF canonical redirects can send them to the preferred spelling. Choose an enabled marker; Custom also needs a valid custom value."
PLG_SYSTEM_TAGROUTING_FIELD_BREADCRUMB_MARKER_LABEL="Breadcrumb tag marker"
PLG_SYSTEM_TAGROUTING_FIELD_BREADCRUMB_MARKER_DESC="Text for the separate breadcrumb item, for example # or Tags. Leave empty for no marker item. This affects standalone tag pages only."
PLG_SYSTEM_TAGROUTING_FIELD_SHOW_BREADCRUMB_MARKER_LABEL="Show breadcrumb tag marker"
PLG_SYSTEM_TAGROUTING_FIELD_SHOW_BREADCRUMB_MARKER_DESC="Show the marker where a tag or filter route uses one."
PLG_SYSTEM_TAGROUTING_MARKER_SHORT="!"
PLG_SYSTEM_TAGROUTING_MARKER_TAG="!tag"
PLG_SYSTEM_TAGROUTING_MARKER_FILTER="!filter"
PLG_SYSTEM_TAGROUTING_MARKER_CUSTOM="Custom marker"
PLG_SYSTEM_TAGROUTING_MAX_GROUPS_LABEL="Maximum AND groups"
PLG_SYSTEM_TAGROUTING_MAX_GROUPS_DESC="Limits AND groups separated by +. Example: blue,red+travel contains 2 groups. Applies to category filters and additional tag-page filters. Default 10, maximum 16. Requests exceeding a limit return Page not found."
PLG_SYSTEM_TAGROUTING_MAX_OR_LABEL="Maximum OR options per group"
PLG_SYSTEM_TAGROUTING_MAX_OR_DESC="Limits choices separated by commas within one group. blue,red contains 2 choices. A hierarchy such as colour/blue counts as one choice. Default 10, maximum 32."
PLG_SYSTEM_TAGROUTING_MAX_OPTIONS_LABEL="Maximum options in total"
PLG_SYSTEM_TAGROUTING_MAX_OPTIONS_DESC="Limits choices across all groups. blue,red+travel contains 3 choices in total. Repeated choices still count when checking the limit. Default 15, maximum 512."
PLG_SYSTEM_TAGROUTING_MAX_BYTES_LABEL="Maximum filter-expression bytes"
PLG_SYSTEM_TAGROUTING_MAX_BYTES_DESC="Limits the length of the filter expression after the marker, excluding the page route. Counts UTF-8 bytes: ordinary English characters usually count as 1, Greek letters usually as 2. Default 1024, maximum 2048. Keep the default unless your tag aliases require longer expressions."

PLG_SYSTEM_TAGROUTING_FACET_SCOPE_LABEL="Available category filters"
PLG_SYSTEM_TAGROUTING_FACET_SCOPE_DESC="Controls which tags can be used as category filters. Assign Colour to a category to allow it and its descendants, such as Blue. Inherited mode adds the roots assigned to all parent categories; a child cannot hide inherited roots. All available tags removes the assignment restriction. Displayed filter controls are provided by your template."
PLG_SYSTEM_TAGROUTING_SCOPE_CATEGORY="Category tags only"
PLG_SYSTEM_TAGROUTING_SCOPE_INHERITED="Category and ancestor category tags"
PLG_SYSTEM_TAGROUTING_SCOPE_ALL="All available tags"
PLG_SYSTEM_TAGROUTING_DESCENDANTS_LABEL="Include descendant tags in filters"
PLG_SYSTEM_TAGROUTING_DESCENDANTS_DESC="No: selecting Colour matches items tagged with Colour itself. Yes: it also matches items tagged only with Blue or other descendants. Your selected controls stay selected. This is the default for category filters and additional tag-page filters; a SmartTag Pages menu item can override it. It does not replace Joomla Tags Include Children for the base standalone tag."

PLG_SYSTEM_TAGROUTING_OPTIONS_TAB="SmartTag Routing"
PLG_SYSTEM_TAGROUTING_OPTIONS_DESC="Configure tag URLs and filtering."

