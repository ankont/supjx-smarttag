PLG_SYSTEM_SMARTTAGENHANCEMENTS_CUSTOM_FIELDS_DESC="Ενεργοποιεί τα πρόσθετα πεδία του Joomla στις ετικέτες και προσθέτει τις επιλογές Πεδία και Ομάδες Πεδίων στο μενού ετικετών. Οι ορισμοί και οι τιμές των πεδίων διατηρούνται κατά την απενεργοποίηση."
