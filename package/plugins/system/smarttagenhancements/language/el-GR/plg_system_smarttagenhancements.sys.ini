PLG_SYSTEM_SMARTTAGENHANCEMENTS="SuperSoftJx - SmartTag Enhancements"
PLG_SYSTEM_SMARTTAGENHANCEMENTS_XML_DESCRIPTION="Προσθέτει επεξεργασία ετικετών στο frontend και υποστήριξη Πρόσθετων Πεδίων του Joomla. Διαχειριστείτε ετικέτες, πεδία και ομάδες από το Components > SupJx SmartTags. Ένας σύνδεσμος επεξεργασίας ετικέτας στο site ανοίγει τη φόρμα για χρήστες με τα κατάλληλα δικαιώματα. Για τις τιμές των πρόσθετων πεδίων ενεργοποιήστε και το Σύστημα - Πεδία."
