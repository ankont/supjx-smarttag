PLG_SYSTEM_SMARTTAGENHANCEMENTS_XML_DESCRIPTION="Adds frontend tag editing and Joomla Custom Fields support to tags. Open Components > SupJx SmartTags to manage tags, fields and groups. Use a tag edit link on the site to edit permitted tags. Enable System - Fields for custom field values."
