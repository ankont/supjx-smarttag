COM_TAGROUTING="SuperSoftJx - SmartTag Routing Context"

COM_TAGROUTING_GROUP_CATEGORIES_LABEL="Group articles by category"
COM_TAGROUTING_GROUP_CATEGORIES_DESC="Groups articles under their actual category, such as News or Guides, instead of listing categories as separate results. Other content types remain separate. One shared pagination is used, so a group may continue on the next page. Your template must support the group display."
COM_TAGROUTING_TAG_FACETS_LABEL="Enable additional tag filters"
COM_TAGROUTING_TAG_FACETS_DESC="Lets visitors narrow a tag page using extra tags. Example: /tags/topics/travel/!/blue keeps the Travel topic and adds Blue as a filter. Requires a nonempty menu route and Use menu route as canonical URL set to Yes. Not available on root-marker standalone URLs. Your template provides the filter controls."
COM_TAGROUTING_TAG_SCOPE_LABEL="Available additional filters"
COM_TAGROUTING_TAG_SCOPE_SELECTED="Selected roots and their descendants"
COM_TAGROUTING_TAG_SCOPE_ALL="All available tags"
COM_TAGROUTING_TAG_ROOTS_LABEL="Filter taxonomy roots"
COM_TAGROUTING_TAG_ROOTS_DESC="Choose the tag branches available as extra filters. Selecting Colour permits Colour and its descendants, such as Blue and Red. Empty means no permitted filters; choose All available tags explicitly if that is intended."
COM_TAGROUTING_TAG_DESCENDANTS_LABEL="Include descendants in additional filter matching"
COM_TAGROUTING_TAG_DESCENDANTS_DESC="Use Default follows the global SmartTag setting shown in brackets. Yes: selecting Colour also matches items tagged with Blue beneath it. No: match the selected tag itself only. This concerns extra filters, not Joomla Include Children for the base tag page. Selected parent/child controls are retained."
