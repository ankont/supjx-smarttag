COM_TAGROUTING="SuperSoftJx - SmartTag Routing Context"
COM_TAGROUTING_XML_DESCRIPTION="Provides the SupJx SmartTag Pages menu item used as Joomla context for standalone tag pages."
COM_TAGROUTING_TAG_PAGES_MENU_TITLE="SupJx SmartTag Pages"
COM_TAGROUTING_TAG_PAGES_MENU_DESC="Provides a configurable landing page plus menu, template, module, language, and Itemid context for standalone hierarchical tag pages."
COM_TAGROUTING_FIELD_LANDING_PAGE_LABEL="Page to display"
COM_TAGROUTING_FIELD_LANDING_PAGE_DESC="Choose what the bare menu route displays. The virtual root uses Joomla's native tag-page layout with zero content results. This does not affect child standalone tag pages."
COM_TAGROUTING_LANDING_PAGE_VIRTUAL_ROOT="Virtual tag root (default)"
COM_TAGROUTING_LANDING_PAGE_TOP_LEVEL_TAGS="Top-level tags"
COM_TAGROUTING_LANDING_PAGE_ALL_TAGS="All tags"
COM_TAGROUTING_LANDING_PAGE_EMPTY="Empty — routing context only"
COM_TAGROUTING_FIELD_LANDING_TITLE_LABEL="Page title"
COM_TAGROUTING_FIELD_LANDING_TITLE_DESC="Title displayed above the virtual tag-root page."
COM_TAGROUTING_FIELD_LANDING_ICON_LABEL="Page icon class"
COM_TAGROUTING_FIELD_LANDING_ICON_DESC="CSS classes for the icon displayed beside the virtual tag-root title, for example fas fa-filter."
COM_TAGROUTING_FIELD_USE_MENU_CANONICAL_LABEL="Use menu route as canonical URL"
COM_TAGROUTING_FIELD_USE_MENU_CANONICAL_DESC="When enabled, this item's full menu route is the canonical base for standalone tag pages. When disabled, the item supplies Joomla context only and the canonical URL uses the configured routing marker."
COM_TAGROUTING_FIELD_BIND_ROOT_MARKER_LABEL="Bind root routing marker to this menu item"
COM_TAGROUTING_FIELD_BIND_ROOT_MARKER_DESC="Yes: root marker URLs (such as /!/... and accepted aliases) open standalone tag pages using this menu context. No: leave root marker URLs to the underlying page's filtering router, without standalone tag breadcrumbs or redirects to this menu. Standalone tag links then always use this item's menu route, regardless of the canonical URL setting. Requires a distinct, non-empty menu route; an empty route retains the existing marker behavior."
